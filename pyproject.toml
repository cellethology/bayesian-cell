[project]
name = "cellsim"
version = "0.1.0"
description = "Cell navigation simulator: Bayesian chemotaxis via receptor biochemistry"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

# Extra dependencies for the separate robotic/ EKF study (not needed for cellsim).
#   uv sync --extra robotic
[project.optional-dependencies]
robotic = [
    "filterpy>=1.4.5",
    "pandas>=2.0",
    "seaborn>=0.13",
    "tqdm>=4.60",
    "numba>=0.59",
]

[project.scripts]
cellsim = "cellsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Python components share this project; robotics dependencies remain optional.
# MATLAB reference code and tissue data stay in the repository.
[tool.hatch.build.targets.wheel]
packages = ["cellsim", "robotic", "source_kf"]
exclude = ["robotic/output/**"]
